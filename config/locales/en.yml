en:
  label_smartfull_users: "Users"
  label_smartfull_team_users_new: "New user"
  label_smartfull_users_projects: "Projects (roles)"
  label_smartfull_team_users_allowed_roles: "Allowed roles"
  label_smartfull_team_users_enabled_users: "Who can create users"
  button_smartfull_lock: "Deactivate"
  button_smartfull_unlock: "Reactivate"
  field_smartfull_can_create_users: "Can create users"
  field_smartfull_manager: "Shown in the list of"
  text_smartfull_can_create_users_info: "Gets a \"Users\" button in the top menu: creates, edits, deactivates and reactivates the accounts in their list, in projects they are a member of and with the roles allowed in the plugin settings. Does not become an administrator and cannot delete anyone."
  text_smartfull_manager_info: "Who can see, edit and deactivate this user from the \"Users\" page. Accounts created by the plugin already have their creator here."
  text_smartfull_team_users_login_info: "If left blank, the email will be used as login."
  text_smartfull_team_users_roles_info: "The selected roles apply to all selected projects."
  text_smartfull_team_users_info: "The account is created with a random password, emailed to the person, who must change it at first login."
  text_smartfull_edit_user_info: "Unchecking a project removes the person from it. Roles you cannot give (set by an administrator) are left unchanged."
  text_smartfull_team_users_no_roles_configured: "No role has been enabled for this feature. Ask an administrator to configure the plugin in Administration → Plugins."
  text_smartfull_team_users_no_projects: "You are not a member of any active project, so there is nowhere to add the new account."
  text_smartfull_users_empty: "No users in your list yet. Click \"New user\" to create the first one."
  text_smartfull_users_info: "This list shows the users you created and those an administrator put in your list. To delete an account, ask an administrator; deactivating already blocks access and keeps the history."
  text_smartfull_lock_confirm: "Deactivate %{name}? They will no longer be able to log in, but their history is kept. You can reactivate them later."
  text_smartfull_team_users_settings_info: "Select the roles that users with the \"Can create users\" option may give to the accounts they create."
  text_smartfull_team_users_enabled_users_info: "To turn it on or off: Administration → Users → edit the user → \"Can create users\"."
  error_smartfull_team_users_no_role: "Select at least one role."
  error_smartfull_team_users_no_project: "Select at least one project."
  notice_smartfull_team_users_created: "User %{login} created and added to: %{projects}. Login details were sent to %{mail}."
  notice_smartfull_user_updated: "User %{login} updated."
  notice_smartfull_user_locked: "User %{login} deactivated."
  notice_smartfull_user_unlocked: "User %{login} reactivated."

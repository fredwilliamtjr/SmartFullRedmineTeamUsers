pt-BR:
  label_smartfull_users: "Usuários"
  label_smartfull_team_users_new: "Novo usuário"
  label_smartfull_users_projects: "Projetos (papéis)"
  label_smartfull_team_users_allowed_roles: "Papéis permitidos"
  label_smartfull_team_users_enabled_users: "Quem pode criar usuários"
  button_smartfull_lock: "Desativar"
  button_smartfull_unlock: "Reativar"
  field_smartfull_can_create_users: "Pode criar usuários"
  field_smartfull_manager: "Aparece na lista de"
  text_smartfull_can_create_users_info: "Ganha o botão \"Usuários\" no topo: cria, edita, desativa e reativa as contas da lista dele, nos projetos de que é membro e com os papéis liberados na configuração do plugin. Não vira administrador e não exclui ninguém."
  text_smartfull_manager_info: "Quem pode ver, editar e desativar este usuário pela página \"Usuários\". Contas criadas pelo plugin já vêm com quem criou."
  text_smartfull_team_users_login_info: "Se ficar em branco, o login será o e-mail."
  text_smartfull_team_users_roles_info: "Os papéis marcados valem para todos os projetos marcados."
  text_smartfull_team_users_info: "A conta é criada com uma senha aleatória, enviada por e-mail para a pessoa, que terá de trocá-la no primeiro acesso."
  text_smartfull_edit_user_info: "Desmarcar um projeto tira a pessoa dele. Papéis que você não pode dar (definidos pelo administrador) não são alterados."
  text_smartfull_team_users_no_roles_configured: "Nenhum papel foi liberado para este recurso. Peça ao administrador para configurar o plugin em Administração → Plugins."
  text_smartfull_team_users_no_projects: "Você não é membro de nenhum projeto ativo, então não há onde colocar a conta nova."
  text_smartfull_users_empty: "Nenhum usuário na sua lista ainda. Clique em \"Novo usuário\" para criar o primeiro."
  text_smartfull_users_info: "Aparecem aqui os usuários que você criou e os que o administrador colocou na sua lista. Para excluir uma conta, fale com o administrador; desativar já impede o acesso e mantém o histórico."
  text_smartfull_lock_confirm: "Desativar %{name}? A pessoa não vai mais conseguir entrar, mas o histórico fica. Dá para reativar depois."
  text_smartfull_team_users_settings_info: "Marque os papéis que quem tem a opção \"Pode criar usuários\" pode dar às contas que criar. Não marque papéis com poderes que essa pessoa não deveria repassar."
  text_smartfull_team_users_enabled_users_info: "Para ligar ou desligar: Administração → Usuários → editar o usuário → \"Pode criar usuários\"."
  error_smartfull_team_users_no_role: "Marque pelo menos um papel."
  error_smartfull_team_users_no_project: "Marque pelo menos um projeto."
  notice_smartfull_team_users_created: "Usuário %{login} criado e incluído em: %{projects}. Os dados de acesso foram enviados para %{mail}."
  notice_smartfull_user_updated: "Usuário %{login} atualizado."
  notice_smartfull_user_locked: "Usuário %{login} desativado."
  notice_smartfull_user_unlocked: "Usuário %{login} reativado."
